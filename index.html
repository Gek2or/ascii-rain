<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A small, zero-dependency ASCII rain screensaver for your browser."
    />
    <meta name="theme-color" content="#060a0b" />
    <title>ASCII Rain — a tiny browser screensaver</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #060a0b;
        color: #eff8f1;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --muted: #8da49a;
        --green: #72e7a3;
        --line: rgba(159, 218, 183, 0.16);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 45%, rgba(16, 62, 41, 0.28), transparent 58%),
          #060a0b;
      }

      button, input { font: inherit; }

      #rain {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        opacity: 0.67;
      }

      .shade {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(3, 7, 8, 0.38), transparent 25% 75%, rgba(3, 7, 8, 0.38));
      }

      .app {
        position: relative;
        z-index: 2;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(20px, 4vw, 48px);
      }

      .topbar, .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand, .live, .key-hint {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(114, 231, 163, 0.42);
        border-radius: 9px;
        color: var(--green);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 14px;
      }

      .brand-name {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .live, .eyebrow, .footer, .key-hint, .readout {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(114, 231, 163, 0.8);
      }

      .hero {
        width: min(100%, 740px);
        margin: auto;
        padding: 54px 0 46px;
        text-align: center;
      }

      .eyebrow { margin: 0 0 18px; }

      h1 {
        margin: 0;
        font-size: clamp(58px, 12vw, 124px);
        font-weight: 760;
        letter-spacing: -0.095em;
        line-height: 0.92;
      }

      h1 span {
        color: var(--green);
        text-shadow: 0 0 36px rgba(80, 231, 145, 0.28);
      }

      .lede {
        margin: 22px 0 34px;
        color: #b4c5bc;
        font-size: clamp(15px, 2.3vw, 18px);
      }

      .controls {
        display: grid;
        grid-template-columns: auto minmax(150px, 1fr) minmax(150px, 1fr);
        align-items: center;
        gap: 22px;
        width: min(100%, 660px);
        margin: 0 auto;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(9, 17, 15, 0.76);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
        text-align: left;
        backdrop-filter: blur(14px);
      }

      .toggle {
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid rgba(114, 231, 163, 0.5);
        border-radius: 9px;
        background: rgba(114, 231, 163, 0.1);
        color: #dfffea;
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
        transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
      }

      .toggle:hover { background: rgba(114, 231, 163, 0.18); }
      .toggle:active { transform: translateY(1px); }
      :focus-visible { outline: 2px solid #aaffc5; outline-offset: 3px; }

      .slider { display: grid; gap: 8px; }

      .slider-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #d1dfd7;
        font-size: 12px;
      }

      .readout { color: var(--green); font-size: 10px; }

      input[type="range"] {
        width: 100%;
        height: 4px;
        margin: 0;
        accent-color: var(--green);
        cursor: pointer;
      }

      .key-hint {
        justify-content: center;
        gap: 8px;
        margin-top: 22px;
        letter-spacing: 0.03em;
        text-transform: none;
      }

      kbd {
        padding: 4px 7px;
        border: 1px solid rgba(159, 218, 183, 0.22);
        border-radius: 5px;
        background: rgba(7, 14, 11, 0.76);
        color: #cde9d8;
        font: inherit;
        font-size: 10px;
      }

      .footer { font-size: 10px; letter-spacing: 0.04em; text-transform: none; }
      .footer span:last-child { text-align: right; }

      @media (max-width: 620px) {
        .app { padding: 20px; }
        .controls { grid-template-columns: 1fr 1fr; gap: 20px 16px; padding: 16px; }
        .toggle { grid-column: 1 / -1; }
        .footer { align-items: flex-start; font-size: 9px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="rain" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <main class="app">
      <header class="topbar">
        <div class="brand" aria-label="ASCII Rain">
          <span class="brand-mark" aria-hidden="true">&gt;_</span>
          <span class="brand-name">ASCII RAIN</span>
        </div>
        <div class="live"><span class="live-dot" aria-hidden="true"></span><span id="status">Running locally</span></div>
      </header>

      <section class="hero" aria-labelledby="title">
        <p class="eyebrow">A little weather for your screen</p>
        <h1 id="title">ASCII <span>RAIN</span></h1>
        <p class="lede">Falling characters. A quieter kind of screen noise.</p>

        <div class="controls" aria-label="Rain controls">
          <button class="toggle" id="toggle" type="button" aria-pressed="false">Pause rain</button>

          <label class="slider" for="speed">
            <span class="slider-heading"><span>Speed</span><output class="readout" id="speed-value" for="speed">5 / 9</output></span>
            <input id="speed" type="range" min="1" max="9" value="5" />
          </label>

          <label class="slider" for="density">
            <span class="slider-heading"><span>Density</span><output class="readout" id="density-value" for="density">62%</output></span>
            <input id="density" type="range" min="15" max="100" value="62" />
          </label>
        </div>

        <p class="key-hint"><kbd>SPACE</kbd> pause / resume <span aria-hidden="true">·</span> <kbd>R</kbd> reshuffle</p>
      </section>

      <footer class="footer">
        <span>Zero dependencies. Zero network calls.</span>
        <span>It doesn’t read your files. It barely has a plot.</span>
      </footer>
    </main>

    <script>
      (() => {
        const canvas = document.querySelector("#rain");
        const context = canvas.getContext("2d", { alpha: false });
        const speedInput = document.querySelector("#speed");
        const densityInput = document.querySelector("#density");
        const speedValue = document.querySelector("#speed-value");
        const densityValue = document.querySelector("#density-value");
        const toggle = document.querySelector("#toggle");
        const status = document.querySelector("#status");
        const glyphs = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*+-<>/\\";
        const fontSize = 15;
        const lineHeight = 21;
        let width = 0;
        let height = 0;
        let columns = [];
        let lastFrame = 0;
        let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function makeColumns() {
          const count = Math.ceil(width / fontSize) + 1;
          columns = Array.from({ length: count }, () => ({
            row: Math.random() * (height / lineHeight),
            fall: 0.35 + Math.random() * 0.8,
            active: Math.random(),
          }));
        }

        function resize() {
          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
          context.fillStyle = "#060a0b";
          context.fillRect(0, 0, width, height);
          context.font = `${fontSize}px ui-monospace, SFMono-Regular, Consolas, monospace`;
          context.textBaseline = "top";
          makeColumns();
        }

        function updateReadouts() {
          speedValue.value = `${speedInput.value} / 9`;
          densityValue.value = `${densityInput.value}%`;
        }

        function updateState() {
          toggle.textContent = paused ? "Resume rain" : "Pause rain";
          toggle.setAttribute("aria-pressed", String(paused));
          status.textContent = paused ? "Paused" : "Running locally";
          if (!paused) requestAnimationFrame(draw);
        }

        function draw(now) {
          if (paused) return;
          const speed = Number(speedInput.value);
          const frameDelay = 125 - speed * 9;
          if (now - lastFrame < frameDelay) {
            requestAnimationFrame(draw);
            return;
          }
          lastFrame = now;
          context.fillStyle = "rgba(6, 10, 11, 0.17)";
          context.fillRect(0, 0, width, height);

          const density = Number(densityInput.value) / 100;
          for (let index = 0; index < columns.length; index += 1) {
            const column = columns[index];
            if (column.active > density) continue;

            const x = index * fontSize;
            const y = column.row * lineHeight;
            const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
            context.fillStyle = Math.random() > 0.985 ? "#d9ffe5" : "#5edb91";
            context.fillText(glyph, x, y);

            column.row += column.fall * (speed / 5);
            if (y > height && Math.random() > 0.975) column.row = -Math.random() * 12;
          }
          requestAnimationFrame(draw);
        }

        toggle.addEventListener("click", () => {
          paused = !paused;
          updateState();
        });
        speedInput.addEventListener("input", updateReadouts);
        densityInput.addEventListener("input", updateReadouts);
        window.addEventListener("resize", resize, { passive: true });
        document.addEventListener("keydown", (event) => {
          const target = event.target;
          const isFormControl = target instanceof HTMLElement && target.matches("input, button, select, textarea");
          if (event.code === "Space" && !isFormControl) {
            event.preventDefault();
            toggle.click();
          } else if (event.key.toLowerCase() === "r" && !isFormControl) {
            makeColumns();
          }
        });

        resize();
        updateReadouts();
        updateState();
      })();
    </script>
  </body>
</html>
